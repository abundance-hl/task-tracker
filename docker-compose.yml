services:
  backend:
    build: ./backend
    volumes:
      - task-data:/data
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/tasks/stats', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  task-data:
